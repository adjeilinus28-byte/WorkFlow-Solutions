<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Page Not Found — WorkFlow Solutions</title>
<meta name="robots" content="noindex"/>
<link rel="icon" href="/favicon.ico" sizes="any"/>
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png"/>
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#080C16;--amber:#F59E0B;--amberL:#FCD34D;--white:#F1F5F9;--mute:#64748B}
html,body{height:100%;font-family:'DM Sans',sans-serif}
body{
  background:linear-gradient(135deg,#EEF2FF 0%,#F8FAFC 40%,#FFFBEB 70%,#FFF7ED 100%);
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:40px 5%;position:relative;overflow:hidden;
}
.grid-bg{position:fixed;inset:0;pointer-events:none;
  background-image:radial-gradient(circle,rgba(15,23,42,.08) 1px,transparent 1px);
  background-size:32px 32px}
.orb1{position:fixed;width:500px;height:500px;border-radius:50%;filter:blur(60px);
  background:rgba(245,158,11,.08);left:-10%;top:10%;pointer-events:none}
.orb2{position:fixed;width:400px;height:400px;border-radius:50%;filter:blur(60px);
  background:rgba(99,102,241,.07);right:-5%;bottom:10%;pointer-events:none}
.card{
  background:rgba(255,255,255,.85);backdrop-filter:blur(20px);
  border:1px solid rgba(15,23,42,.09);border-radius:24px;
  padding:64px 56px;text-align:center;max-width:520px;width:100%;
  box-shadow:0 24px 64px rgba(15,23,42,.08);position:relative;z-index:1;
}
.mark{margin:0 auto 32px;width:72px;height:52px}
.mark svg{width:72px;height:52px}
.err-code{
  font-family:'DM Mono',monospace;font-size:11px;font-weight:500;
  color:#B45309;text-transform:uppercase;letter-spacing:.12em;margin-bottom:16px;
  background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.25);
  display:inline-block;padding:4px 14px;border-radius:99px;
}
h1{
  font-family:'Syne',sans-serif;font-size:clamp(36px,6vw,56px);
  font-weight:800;letter-spacing:-.04em;color:#0F172A;line-height:1;margin-bottom:16px;
}
h1 span{color:var(--amber)}
p{font-size:16px;color:var(--mute);line-height:1.75;margin-bottom:40px}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn-home{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--amber);color:#0F172A;
  font-family:'DM Sans',sans-serif;font-size:14.5px;font-weight:600;
  padding:13px 28px;border-radius:8px;text-decoration:none;
  transition:all .25s;border:none;
}
.btn-home:hover{background:var(--amberL);transform:translateY(-2px);box-shadow:0 8px 24px rgba(245,158,11,.3)}
.btn-home svg{width:16px;height:16px;transition:transform .25s}
.btn-home:hover svg{transform:translateX(4px)}
.btn-contact{
  display:inline-flex;align-items:center;gap:8px;
  background:transparent;color:#0F172A;
  font-family:'DM Sans',sans-serif;font-size:14.5px;font-weight:400;
  padding:13px 28px;border-radius:8px;text-decoration:none;
  border:1px solid rgba(15,23,42,.15);transition:all .25s;
}
.btn-contact:hover{border-color:rgba(245,158,11,.4);background:rgba(245,158,11,.06);transform:translateY(-2px)}
.footer-note{margin-top:40px;padding-top:24px;border-top:1px solid rgba(15,23,42,.08);font-size:12px;color:#64748B;font-family:'DM Mono',monospace}
.footer-note a{color:#B45309;text-decoration:none}
.footer-note a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="orb1"></div>
<div class="orb2"></div>

<main class="card">
  <div class="mark">
    <svg viewBox="0 0 60 42" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <polyline points="5,6 17,36 30,18 43,36 55,6" fill="none" stroke="#334155" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="5"  cy="6"  r="4"   fill="none" stroke="#334155" stroke-width="1.8"/>
      <circle cx="30" cy="18" r="3.2" fill="none" stroke="#64748B" stroke-width="1.6"/>
      <circle cx="55" cy="6"  r="4"   fill="none" stroke="#334155" stroke-width="1.8"/>
      <circle cx="17" cy="36" r="5.5" fill="#F59E0B"/>
      <circle cx="17" cy="36" r="2.1" fill="#FFFFFF"/>
      <circle cx="43" cy="36" r="5.5" fill="#F59E0B"/>
      <circle cx="43" cy="36" r="2.1" fill="#FFFFFF"/>
    </svg>
  </div>

  <div class="err-code">Error 404</div>
  <h1>Page <span>Not</span> Found</h1>
  <p>The page you're looking for doesn't exist or has been moved. Let's get you back on track — your workflow doesn't stop here.</p>

  <div class="actions">
    <a href="/" class="btn-home">
      Back to Home
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </a>
    <a href="/#contact" class="btn-contact">Contact Us</a>
  </div>

  <div class="footer-note">
    WorkFlow Solutions &nbsp;·&nbsp; <a href="/">workflow-app.net</a> &nbsp;·&nbsp; <a href="/privacy.html">Privacy</a> &nbsp;·&nbsp; <a href="/terms.html">Terms</a>
  </div>
</main>
</body>
</html>
